<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forecast App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        table, th, td {
            border: 1px solid #ddd;
        }
        th, td {
            padding: 10px;
            text-align: left;
        }
    </style>
</head>
<body>
    <h1>Weather Forecast for 7 Days</h1>

    <button onclick="fetchForecasts()">Fetch Forecasts</button>
    <div id="forecast-status"></div>

    <h2>Locations & Forecasts</h2>
    <table>
        <thead>
            <tr>
                <th>Location</th>
                <th>Date</th>
                <th>Temperature (°C)</th>
            </tr>
        </thead>
        <tbody id="forecast-table">
        </tbody>
    </table>

    <script>
        function fetchForecasts() {
            fetch('/fetch-forecast')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('forecast-status').innerText = 'Data fetched successfully!';
                    updateTable(data);
                })
                .catch(error => {
                    console.error('Error fetching forecasts:', error);
                    document.getElementById('forecast-status').innerText = 'Error fetching forecasts.';
                });
        }

        function updateTable(data) {
            const tableBody = document.getElementById('forecast-table');
            tableBody.innerHTML = ''; 

            Object.keys(data).forEach(location => {
                const forecasts = data[location].data[0].coordinates[0].dates;

                forecasts.forEach(forecast => {
                    const row = document.createElement('tr');
                    const locationCell = document.createElement('td');
                    const dateCell = document.createElement('td');
                    const tempCell = document.createElement('td');

                    locationCell.textContent = location;
                    dateCell.textContent = new Date(forecast.date).toLocaleString();
                    tempCell.textContent = forecast.value;

                    row.appendChild(locationCell);
                    row.appendChild(dateCell);
                    row.appendChild(tempCell);

                    tableBody.appendChild(row);
                });
            });
        }
    </script>
</body>
</html>
